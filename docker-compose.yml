version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: epikodi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: epikodi
      POSTGRES_PASSWORD: epikodi_password
      POSTGRES_DB: epikodi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epikodi"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache Redis (optionnel)
  redis:
    image: redis:7-alpine
    container_name: epikodi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application EpiKodi
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: epikodi-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Base de données
      DATABASE_URL: "postgresql://epikodi:epikodi_password@postgres:5432/epikodi"
      
      # Redis
      REDIS_URL: "redis://redis:6379"
      
      # TheMovieDB API (à configurer avec votre clé)
      TMDB_API_KEY: "${TMDB_API_KEY:-your_tmdb_api_key_here}"
      TMDB_BASE_URL: "https://api.themoviedb.org/3"
      
      # NextAuth
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-change-this-to-a-random-secret}"
      NEXTAUTH_URL: "http://localhost:3000"
      
      # Chemin des médias (à monter comme volume)
      MEDIA_PATH: "/app/media"
      
      # Application
      NODE_ENV: "production"
      PORT: 3000
    volumes:
      # Monter votre dossier de médias local
      - ./media:/app/media:ro
      # Uploads
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
